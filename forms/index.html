<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="container"> 
  <div class="left">
    <img src="https://images.unsplash.com/photo-1585202900225-6d3ac20a6962?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
  </div>
  <div class="right">
      <h1>Sign up form</h1>
      <p>Welcome to my club. Please fill out the form below to join.</p>
      <form action="">
        <div class="input">
          <div class="row">
            <label for='name'>Name:
              <input type='text' name='name' id='name'>
            </label>
            <label for='email'>Email:
              <input type='email' name='email' id='email'>
            </label>
          </div>
          <div class="row">
            <label for="password">Password:
              <input type="password" />
            </label>
            <label for="password">Confirm password:
              <input type="password" />
            </label>
          </div>
        </div>
      <label for='message'>Message: <textarea rows="5" cols="30"></textarea>
      </label>
      <div class="note"></div>
      <button type='submit'>Submit</button>
    </form>
  </div>
</div>
</body>
</html>
